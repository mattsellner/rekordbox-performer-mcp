[project]
name = "rekordbot"
version = "0.1.0"
description = "Autonomous Windows DJ and safety-first Rekordbox control engine"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4,<4",
    "mido>=1.3,<2",
    "Pillow>=10,<13",
    "pywinauto>=0.6.8,<0.7",
    "pyrekordbox>=0.4.3,<0.5",
    "python-rtmidi>=1.5,<2",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
app = [
    "pystray>=0.19,<0.20",
]
package = [
    "pyinstaller>=6.0,<7",
    "pystray>=0.19,<0.20",
]
rehearsal = [
    "numpy>=2.0,<3",
    "soundcard>=0.4.4,<0.5",
    "soundfile>=0.13,<0.14",
]

[project.scripts]
rekordbot = "rekordbox_performer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rekordbox_performer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
