[project]
name = "rekordbox-performer"
version = "0.1.0"
description = "Safety-first MCP control surface for Rekordbox via virtual MIDI"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4,<4",
    "mido>=1.3,<2",
    "python-rtmidi>=1.5,<2",
    "pydantic>=2.11,<3",
]

[project.scripts]
rekordbox-performer = "rekordbox_performer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rekordbox_performer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

